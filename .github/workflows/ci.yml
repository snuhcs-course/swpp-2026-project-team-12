name: CI

on:
  pull_request:
  push:
    branches: [main, "iteration-*-demo"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend and web integration (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Offline mode from backend/developer/DEV_README.md: fixed AI responses, no paid services.
      MOCK_AI_TESTS: "1"
      LIVE_GRAPHITI_TESTS: "0"
      OPENAI_API_KEY: ""
      ELEVENLABS_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Check for missing migrations
        run: python backend/manage.py makemigrations --check --dry-run
      - name: Run pytest
        run: python -m pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  web:
    name: Web modules (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test web/test_family_tree.mjs web/test_images.mjs web/test_usability.mjs web/test_assistant.mjs web/test_maintenance.mjs web/test_daily_questions.mjs

  android:
    name: Android unit tests and test build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-unit-test-reports
          path: client/app/build/reports/tests/

  android-emulator:
    name: Android instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DJANGO_DB_PATH: ${{ github.workspace }}/e2e.sqlite3
      DJANGO_MEDIA_ROOT: ${{ github.workspace }}/e2e-media
      # The emulator reaches the runner's Django server through 10.0.2.2.
      DJANGO_ALLOWED_HOSTS: 10.0.2.2,127.0.0.1,localhost
      # configs/wsgi.py starts the Graphiti search pool at boot, which refuses empty credentials.
      # ApiRoundTripTest never searches, so placeholders only let the server start.
      OPENAI_API_KEY: ci-placeholder
      NEO4J_PASSWORD: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Start Django for ApiRoundTripTest
        run: |
          python backend/manage.py migrate --noinput
          nohup python backend/manage.py runserver 0.0.0.0:8000 --noreload > runserver.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:8000/api/test_reply/ > /dev/null; do sleep 1; done' || { cat runserver.log; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # A cached AVD snapshot skips the cold boot on later runs.
      - uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          # PostingFeedbackTest verifies character motion and requires enabled animators.
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: client
          # "System UI isn't responding" dialogs on the software-rendered emulator cover the app under test.
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put global window_animation_scale 1
            adb shell settings put global transition_animation_scale 1
            adb shell settings put global animator_duration_scale 1
            ./gradlew :app:connectedDebugAndroidTest --console=plain
      - name: List failed instrumented tests
        if: failure()
        run: |
          python - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("client/app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in case.findall("failure") + case.findall("error"):
                      lines = (problem.text or problem.get("message") or "").strip().splitlines()
                      # The first app frame is often a shared helper, so also name the line in the test itself.
                      frames = [line.strip() for line in lines if "kr.talkdock" in line]
                      test_frame = next((frame for frame in frames if f".{case.get('name')}(" in frame), "")
                      where = " ".join(dict.fromkeys(frame for frame in (frames[0] if frames else "", test_frame) if frame))
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{lines[0] if lines else ''} {where}")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumented-test-reports
          path: |
            client/app/build/reports/androidTests/
            client/app/build/outputs/androidTest-results/
            runserver.log
          if-no-files-found: ignore
