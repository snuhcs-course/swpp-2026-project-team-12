<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fffdf7">
    <meta name="robots" content="noindex">
    <title>토닥 · 서비스 이용 안내</title>
    <style>
      @font-face {
        font-family: Todak; src: url('/maintenance/font.ttf') format('truetype');
        font-weight: 100 900; font-display: swap;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        padding: 24px; background: #fffdf7; color: #443c38;
        font-family: Todak, "Noto Sans KR", "Malgun Gothic", sans-serif;
        line-height: 1.6; word-break: keep-all;
      }
      main {
        width: min(100%, 420px);
      }
      img { display: block; width: 180px; height: 216px; max-width: 100%; object-fit: contain; margin: 0 auto 20px; }
      h1 { margin: 0 0 12px; font-size: 26px; font-weight: 700; line-height: 1.4; }
      p { margin: 0; color: #79706a; font-size: 17px; }
      #maintenance-message { margin-top: 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
      a {
        display: flex; align-items: center; justify-content: center;
        min-height: 56px; margin-top: 24px; padding: 12px;
        border-radius: 16px; background: #f8ded9; color: #443c38;
        font-size: 18px; font-weight: 700; text-decoration: none;
      }
      a:hover { background: #f4d2cb; }
      a:focus-visible { outline: 3px solid #a64e44; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/maintenance/character.png" alt="" width="180" height="216">
      <h1>잠시 이용이 어려워요</h1>
      <p>서버를 점검 중이거나 일시적인 문제가 생겼어요.<br>잠시 후 다시 이용해 주세요.</p>
      <p id="maintenance-message" aria-live="polite" hidden></p>
      <a href="/" target="_top" id="retry">다시 연결하기</a>
    </main>
    <script>
      fetch('/maintenance/message.txt', { cache: 'no-store' }).then(response => {
        if (!response.ok) throw new Error('Message unavailable');
        return response.text();
      }).then(text => {
        const message = document.querySelector('#maintenance-message');
        message.textContent = text.trim();
        message.hidden = !message.textContent;
      }).catch(() => {});
      // An already open web app keeps its forms underneath this notice.
      if (window.parent !== window) document.querySelector('#retry').addEventListener('click', event => {
        event.preventDefault();
        window.parent.postMessage('talkdock-maintenance-retry', window.location.origin);
      });
    </script>
  </body>
</html>
