worker_processes 1;
error_log run/error.log;
pid run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log run/access.log;
    client_body_temp_path run/client_temp;
    proxy_temp_path run/proxy_temp;
    fastcgi_temp_path run/fastcgi_temp;
    uwsgi_temp_path run/uwsgi_temp;
    scgi_temp_path run/scgi_temp;
    types {
        text/html html;
        application/json json;
        image/png png;
        font/ttf ttf;
        text/plain txt;
    }
    charset utf-8;

    map $request_uri $unavailable_page {
        ~^/api(?:/|\?|$) /maintenance.json;
        default /maintenance.html;
    }

    server {
        listen 127.0.0.1:8080;
        server_name _;
        root .;
        client_max_body_size 32m;

        location / {
            # Creating/removing this file takes effect without a reload.
            if (-f $document_root/maintenance.flag) { return 503; }
            error_page 502 503 504 =503 $unavailable_page;

            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            # Preserve Django's feature-specific JSON errors, including AI 503s.
            proxy_intercept_errors off;
        }

        # This page and its original Android artwork stay available without Django.
        location = /maintenance/ {
            try_files /maintenance.html =404;
            add_header Cache-Control "no-store" always;
        }

        location = /maintenance/character.png {
            alias ../../client/app/src/main/assets/todak/td_art_grandchild_sad.png;
        }

        location = /maintenance/font.ttf {
            alias ../../client/app/src/main/res/font/noto_sans_kr.ttf;
        }

        location = /maintenance/message.txt {
            alias ../maintenance-message.txt;
            add_header Cache-Control "no-store" always;
        }

        location ~ ^/maintenance\.(html|json)$ {
            internal;
            add_header Cache-Control "no-store" always;
            add_header Retry-After 60 always;
        }
    }
}
