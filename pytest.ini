[pytest]
# One pytest run covers the backend developer suites and the web integration checks.
# The AI testbeds (iter3_context_retrieval, memoryqa_scaling) are run from their own folders.
DJANGO_SETTINGS_MODULE = configs.settings
pythonpath =
    .
    backend
testpaths =
    backend/developer/test_codes
    backend/developer/test_ai_prompts
    web/test_web.py
python_files = test_*.py
addopts = -ra
